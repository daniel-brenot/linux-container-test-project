name: Publish Docker images

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: musl
            file: Dockerfile
            tag: latest-musl
          - libc: glibc
            file: Dockerfile.glibc
            tag: latest-glibc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          # Optional override: DOCKERHUB_REPOSITORY (defaults to linux-container-test-project)
          repo="${DOCKERHUB_REPOSITORY:-linux-container-test-project}"
          echo "IMAGE_NAME=${DOCKERHUB_USERNAME}/${repo}" >> "$GITHUB_ENV"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.title=linux-container-test-project
            org.opencontainers.image.description=Container runtime verification suites (${{ matrix.libc }})
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
