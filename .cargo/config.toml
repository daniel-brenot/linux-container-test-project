# Freestanding Linux binary: our `_start`, raw syscalls, no libc CRT.
[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-self-contained=no",
    "-C", "link-arg=-nostdlib",
    "-C", "link-arg=-static",
]

[target.aarch64-unknown-linux-musl]
rustflags = [
    "-C", "relocation-model=static",
    "-C", "link-self-contained=no",
    "-C", "link-arg=-nostdlib",
    "-C", "link-arg=-static",
]
